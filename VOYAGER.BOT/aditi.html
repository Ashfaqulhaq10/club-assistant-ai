<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meet Our Club Member</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }
    .logo {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
    }
    .logo img {
      width: 80px;
      height: auto;
      cursor: pointer;
    }
    .voyager {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 2;
      color: #fff;
      font-weight: bold;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      margin: 2rem auto;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      padding: 2rem;
      color: #fff;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      color: #fff;
    }
    .chat-box {
      text-align: left;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    input, button {
      padding: 1rem;
      width: 80%;
      margin-bottom: 1rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
    }
    input {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }
    button {
      background: #5c67f2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #4a54e1;
    }
    .message {
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .user-message {
      text-align: right;
      font-weight: bold;
      color: #ffdd57;
    }
    .bot-message {
      text-align: left;
      font-weight: bold;
      color: #fccb90;
      white-space: pre-wrap;
    }
    .ticket {
      background: white;
      color: black;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      display: none;
      text-align: left;
    }
    .ticket h2 {
      margin-top: 0;
    }
    .download-btn {
      background: #fd1d1d;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      display: none;
    }
    .download-btn:hover {
      background: #ff5733;
    }
    .pay-now-btn {
      background: #00b300;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .pay-now-btn:hover {
      background: #009900;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="Digital Marketing Website Background(720P_HD)_2.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div class="logo">
    <a href="https://www.kalasalingam.ac.in/" target="_blank">
      <img src="Kalasalingam-Academy-of-Research.jpg" alt="Kalasalingam Logo" />
    </a>
  </div>
  <div class="voyager">VOYAGER</div>
  <div class="container">
    <h1>Meet Our Club Member</h1>
    <button id="startButton" onclick="startChat()">Click Enter To Meet Our Club Member</button>
    <div id="chat" class="chat-box" style="display: none;"></div>
    <input type="text" id="userInput" placeholder="Type your response here..." style="display: none;" onkeypress="handleKeyPress(event)">
    <button id="submitButton" onclick="handleResponse()" style="display: none;">Submit</button>
    <div class="ticket" id="ticketSection">
      <h2>Your Event Ticket</h2>
      <pre id="ticketContent" style="font-family: 'Courier New', monospace;"></pre>
      <button class="pay-now-btn" id="payNowButton" onclick="showDownloadButton()">Pay Now</button>
      <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">Download Ticket as PDF</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let step = 0;
    let chat = document.getElementById('chat');
    let userInput = document.getElementById('userInput');
    let submitButton = document.getElementById('submitButton');
    let startButton = document.getElementById('startButton');
    let userName = "";
    let userDepartment = "";
    let userYear = "";
    let userSection = "";
    let userEvent = "";
    let userMobile = "";
    let userRegister = "";
    let userEmail = "";
    let token = "";
    function startChat() {
      startButton.style.display = 'none';
      chat.style.display = 'block';
      userInput.style.display = 'block';
      submitButton.style.display = 'block';
      typeMultipleLines([
        "Click Enter To Meet Our Club Member"
      ], () => {
        setTimeout(() => {
          typeMultipleLines([
            "Hi, I'm Aditi Lohar, what's your name ?"
          ]);
        }, 1000);
      });
    }
    function typeMultipleLines(lines, callback) {
      if (!lines.length) {
        if (callback) callback();
        return;
      }
      let line = lines.shift();
      typeMessage(line, () => {
        typeMultipleLines(lines, callback);
      });
    }
    function typeMessage(message, callback) {
      let p = document.createElement('p');
      p.className = 'message bot-message';
      chat.appendChild(p);
      let lines = message.split('\\n');
      let lineIndex = 0;
      function typeLine() {
        if (lineIndex >= lines.length) {
          if (callback) callback();
          return;
        }
        let currentLine = lines[lineIndex];
        let i = 0;
        let typedLine = '';
        let lineInterval = setInterval(() => {
          typedLine += currentLine.charAt(i);
          p.textContent = typedLine;
          i++;
          if (i === currentLine.length) {
            clearInterval(lineInterval);
            lineIndex++;
            if (lineIndex < lines.length) {
              p.textContent += '\\n';
            }
            setTimeout(typeLine, 100);
          }
          chat.scrollTop = chat.scrollHeight;
        }, 40);
      }
      typeLine();
    }
    function displayMessage(message, isUser = false) {
      let p = document.createElement('p');
      p.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
      p.textContent = message;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }
    function handleResponse() {
      let response = userInput.value.trim();
      if (!response) return;
      displayMessage(response, true);
      userInput.value = "";
      if (step === 0) {
        userName = response;
        setTimeout(() => {
          typeMultipleLines([
            `Nice to meet you ${userName}`
          ], () => {
            setTimeout(() => {
              typeMultipleLines([`Which department are you from  ${userName} ?`]);
            }, 1000);
          });
        }, 1000);
      }
      else if (step === 1) {
        userDepartment = response;
        setTimeout(() => {
          typeMultipleLines([
            `Oh,it's nice ${userName} 😊`
          ], () => {
            setTimeout(() => {
              typeMultipleLines([`${userName} which year are you studying ?`]);
            }, 1000);
          });
        }, 1000);
      }
      else if (step === 2) {
        userYear = response.toLowerCase();
        if (userYear === "second year" || userYear === "2") {
          setTimeout(() => {
            typeMultipleLines([
              "Oh its nice ra"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`Which Section Are you ${userName}`]);
              }, 1000);
            });
          }, 1000);
        }
        else if (userYear === "third year" || userYear === "3") {
          setTimeout(() => {
            typeMultipleLines([
              "Oh its nice brother"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`Which Section Are you ${userName}`]);
              }, 1000);
            });
          }, 1000);
        }
        else if (userYear === "fourth year" || userYear === "4") {
          setTimeout(() => {
            typeMultipleLines([
              "Oh its nice brother"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`Which Section Are you ${userName}`]);
              }, 1000);
            });
          }, 1000);
        }
        else if (userYear === "first year" || userYear === "1") {
          setTimeout(() => {
            typeMultipleLines([
              "Hope you're doing well, kiddo"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`Which Section Are you ${userName}`]);
              }, 1000);
            });
          }, 1000);
        }
        else {
          setTimeout(() => {
            typeMultipleLines([
              "That's an interesting choice!"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`Which Section Are you ${userName}`]);
              }, 1000);
            });
          }, 1000);
        }
      }
      else if (step === 3) {
        userSection = response;
        if (userYear === "second year" || userYear === "2") {
          setTimeout(() => {
            typeMultipleLines([
              "Oh ok ra"
            ], () => {
              setTimeout(() => {
                startEventRegistration();
              }, 1000);
            });
          }, 1000);
        } else {
          startEventRegistration();
        }
      }
      else if (step === 4) {
        if (response === "1") {
          userEvent = "XYZ";
          setTimeout(() => {
            typeMultipleLines([
              `ok thanks ${userName},Hang on a sec, I'll sign up for the event.`
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`${userName} , can i get your mobile number`]);
              }, 1000);
            });
          }, 1000);
        } else if (response === "2") {
          userEvent = "ABC";
          setTimeout(() => {
            typeMultipleLines([
              `ok thanks ${userName},Hang on a sec, I'll sign up for the event.`
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`${userName} , can i get your mobile number`]);
              }, 1000);
            });
          }, 1000);
        } else if (response === "3") {
          userEvent = "DEV";
          setTimeout(() => {
            typeMultipleLines([
              `ok thanks ${userName},Hang on a sec, I'll sign up for the event.`
            ], () => {
              setTimeout(() => {
                typeMultipleLines([`${userName} , can i get your mobile number`]);
              }, 1000);
            });
          }, 1000);
        } else if (response === "4") {
          userEvent = "No event";
          setTimeout(() => {
            typeMultipleLines([
              `okay no problem ${userName},i understand you have a good day 😊`
            ], () => {
              generateTicket();
            });
          }, 1000);
          return;
        } else {
          setTimeout(() => {
            typeMultipleLines(["Please select a valid option: 1, 2, 3, or 4."]);
          }, 1000);
          return;
        }
      }
      else if (step === 5) {
        userMobile = response;
        setTimeout(() => {
          typeMultipleLines(["your register number please"]);
        }, 1000);
      }
      else if (step === 6) {
        userRegister = response;
        userEmail = userRegister + "@klu.ac.in";
        setTimeout(() => {
          typeMultipleLines([
            `Okay ${userName} nice meeting you, your ticket will be sent to your email id ${userEmail} with in few working days`
          ], () => {
            setTimeout(() => {
              typeMultipleLines([`Thanks,good bye ${userName}`]);
            }, 1000);
          });
        }, 1000);
        generateTicket();
        return;
      }
      step++;
    }
    function startEventRegistration() {
      setTimeout(() => {
        typeMultipleLines([
          `${userName}, I am enrolled in a club that regularly holds events which may help you earn credit through certificates.`
        ], () => {
          setTimeout(() => {
            typeMultipleLines([
              "Wanna join any of the events ?"
            ], () => {
              setTimeout(() => {
                typeMultipleLines([
                  "1.XYZ",
                  "2.ABC",
                  "3.DEV",
                  "4.No thanks"
                ]);
              }, 1000);
            });
          }, 1000);
        });
      }, 1000);
    }
    function generateTicket() {
      let emailPart = userEmail.substring(0, 4).toUpperCase();
      let randomPart = Math.random().toString(36).substring(2, 10).toUpperCase();
      token = `${emailPart}-${randomPart}`;
      let ticketText = `Name: ${userName}\nDepartment: ${userDepartment}\nYear: ${userYear}\nSection: ${userSection}\nEvent: ${userEvent}\nEmail: ${userEmail}\nToken: ${token}`;
      document.getElementById('ticketContent').textContent = ticketText;
      document.getElementById('ticketSection').style.display = 'block';
      userInput.style.display = 'none';
      submitButton.style.display = 'none';
    }
    function showDownloadButton() {
      document.getElementById('downloadBtn').style.display = 'inline-block';
    }
    function handleKeyPress(event) {
      if(event.key === 'Enter') {
        handleResponse();
      }
    }
    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const base64Logo = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...' 
      doc.addImage(base64Logo, 'JPEG', 40, 15, 130, 25);
      doc.setFontSize(18);
      doc.text('Your Event Ticket', 20, 55);
      doc.setFontSize(12);
      let startY = 65;
      const lineHeight = 10;
      doc.text('Field', 20, startY);
      doc.text('Value', 100, startY);
      startY += lineHeight;
      doc.line(20, startY - 5, 190, startY - 5);
      let rows = [
        ['Name', userName],
        ['Department', userDepartment],
        ['Year', userYear],
        ['Section', userSection],
        ['Event', userEvent],
        ['Email', userEmail],
        ['Token', token]
      ];
      rows.forEach(row => {
        doc.text(row[0], 20, startY);
        doc.text(row[1], 100, startY);
        startY += lineHeight;
      });
      doc.save('Event_Ticket.pdf');
    }
  </script>
</body>
</html>
